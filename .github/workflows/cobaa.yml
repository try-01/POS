name: Android Release Build coba1

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ./coba

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # Setup Gradle dengan caching otomatis
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          add-job-summary: on-failure
          add-job-summary-as-step-summary: true

      - name: Grant Execute Permission for Gradlew
        run: chmod +x ./gradlew

      # Build Release APK dengan optimasi
      - name: Build APK (Optimized)
        run: ./gradlew assembleRelease --parallel --build-cache --configuration-cache --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
          ORG_GRADLE_PROJECT_android_native_build_output_ignore_errors: true

      # Sign APK dengan action resmi
      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        env:
          BUILD_TOOLS_VERSION: "34.0.0"
        with:
          releaseDirectory: coba/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      # Upload signed APK
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pos-offline-release-signed-apk
          path: |
            ${{steps.sign_app.outputs.signedReleaseFile}}
            coba/app/**/*.json
          retention-days: 1
          if-no-files-found: error

      # Optional: Publish release ke GitHub
      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          files: ${{steps.sign_app.outputs.signedReleaseFile}}
          tag_name: v${{ github.run_number }}
          body: |
            Release APK build ${{ github.run_number }}
            Built with:
            - Kotlin 2.3.20
            - Gradle 9.5.1
            - Android Gradle Plugin 8.10.0
            - Room 3.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}