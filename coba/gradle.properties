# ===== JVM & GRADLE PERFORMANCE =====
# -Xmx3g : RAM utama 3 GB
# -XX:MaxMetaspaceSize=1g : Metaspace 1 GB  
# -XX:+UseParallelGC : Parallel garbage collection untuk multi-core
# -XX:+HeapDumpOnOutOfMemoryError : Debug OOM issues
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError

# ===== PARALLEL BUILD CONFIG =====
org.gradle.workers.max=2
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# ===== KOTLIN & ANDROID CONFIG =====
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvmargs=-Xmx512m
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official